# M3a topology. agent-session-net is INTERNAL: session containers have no
# default route; router and egress-proxy are the only bridges outward.
# Secrets come from deploy/.env (gitignored) or the host environment. Nothing
# here contains a token, key or DSN.
#
# This Compose topology has a real `router` container on `agent-session-net`,
# so session containers resolve `router` through Docker DNS. The host-bridge
# runtime instead sets PADI_ROUTER_HOST_IP=172.20.0.1 and passes ExtraHosts
# `router:172.20.0.1` into session containers. That alias opens no egress;
# `agent-session-net` remains `internal: true`. Compose also provides the real
# egress-proxy container, so container.proxy stays set here; host-bridge
# runtimes without that listener clear it with PADI_PROXY_URL="".
services:
  router:
    build:
      context: ..
      dockerfile: deploy/go/Dockerfile
      args:
        PKG: cmd/router
    environment:
      ROUTER_CONFIG: /etc/padi/router.yaml
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ROUTER_ADMIN_TOKEN: ${ROUTER_ADMIN_TOKEN:-}
    volumes:
      - ../config/router.yaml:/etc/padi/router.yaml:ro
    networks:
      - agent-net
      - agent-session-net

  egress-proxy:
    build:
      context: ..
      dockerfile: deploy/go/Dockerfile
      args:
        PKG: cmd/egress-proxy
    environment:
      EGRESS_CONFIG: /etc/padi/egress.yaml
      ROUTER_TOKEN: ${ROUTER_TOKEN}
      EGRESS_ADMIN_TOKEN: ${EGRESS_ADMIN_TOKEN:-}
    volumes:
      - ../config/egress.yaml:/etc/padi/egress.yaml:ro
    networks:
      - agent-net
      - agent-session-net

  gateway:
    build:
      context: ..
      dockerfile: deploy/go/Dockerfile
      args:
        PKG: cmd/gateway
    environment:
      GATEWAY_CONFIG: /etc/padi/gateway.yaml
      DATABASE_URL: ${DATABASE_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_OWNER_ID: ${TELEGRAM_OWNER_ID:-${TELEGRAM_ALLOWED_USER_ID:-}}
      ROUTER_TOKEN: ${ROUTER_TOKEN}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-${GITHUB_INSTALLATION_ID:-}}
      GITHUB_APP_PRIVATE_KEY_PATH: /srv/agent/secrets/github-app.pem
    # Shared-host / rootless deployments: set PADI_UID/PADI_GID to the owner of
    # the rootless Docker socket so the gateway can both reach the daemon and
    # write /srv/agent. Default keeps the image's nonroot user.
    user: "${PADI_UID:-65532}:${PADI_GID:-65532}"
    volumes:
      - ../config/gateway.yaml:/etc/padi/gateway.yaml:ro
      # DOCKER_SOCK points at a rootless socket (e.g. /run/user/1001/docker.sock)
      # when padi must not share the host's root daemon with other services.
      - "${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock"
      - /srv/agent:/srv/agent
    # The gateway needs the session network for OpenCode HTTP and docker exec.
    # Its own HTTP/UI listener is not part of M3a; add a host firewall rule or
    # an interface-bound listener before exposing port 8080 to sessions.
    networks:
      - agent-net
      - agent-session-net

  # Only for the future web API/HTTPS entry point. Do NOT start this service on
  # a host where another app already owns ports 80/443.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - agent-net

networks:
  agent-net:
    driver: bridge
  agent-session-net:
    driver: bridge
    internal: true
