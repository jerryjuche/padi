# M1 Spine gateway config. No secrets belong in this file.
http:
  listen: ":8080"
  ui_origin: "http://localhost:5173"
  cookie_domain: "localhost"

telegram:
  poll_timeout_s: 30
  edit_interval_ms: 1200
  max_message_chars: 3800
  photo_max_mb: 10

sessions:
  max_sessions: 1
  min_free_mem_mb: 3000
  workspace_retention_days: 7
  workspace_max_mb: 2048

container:
  image: "sandbox-agent-session:latest"
  runtime: runc                  # V10: runsc absent here; revisit on the VM
  internal_network: true         # M3a: no default route out of the sandbox
  memory_mb: 2560
  cpus: 1.0
  pids: 512
  network: "agent-session-net"
  proxy: "http://egress-proxy:3128"
  bundle_max_mb: 200

opencode:
  # M2: OpenCode talks only to the router. The alias maps to an ordered target
  # chain in config/router.yaml; no provider key enters the session container.
  model: "padi/agent-chat"
  # Reachable from the gateway; PADI_ROUTER_BASE_URL overrides for local runs.
  router_base_url: "http://router:8090/v1"
  router_token_env: "ROUTER_TOKEN"
  lsp: false
  snapshots: false

git:
  cache_dir: "/srv/agent/cache/repos"
  workspaces_dir: "/srv/agent/workspaces"
  quarantine_dir: "/srv/agent/quarantine"
  verify_dir: "/srv/agent/verify"
  default_repo: ""               # optional local source for the M1 spike

store:
  dsn_env: "DATABASE_URL"
